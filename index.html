<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So'nggi Xabarlar Tarixi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18181b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #27272a);
            --hint-color: var(--tg-theme-hint-color, #a1a1aa);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .msg-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 8px;
        }
        .msg-body {
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }
        .loading, .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📨 Barcha Xabarlar Tarixi</h2>
        <div id="messages-list">
            <div class="loading">Yuklanmoqda...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Cloudflare Tunnel orqali olingan to'liq havolangiz
        const API_URL = "https://cold-scanned-dirt-orders.trycloudflare.com"; 

        async function fetchMessages() {
            const listEl = document.getElementById('messages-list');
            const initData = tg.initData;

            if (!initData) {
                listEl.innerHTML = '<div class="empty">Telegram ilovasi ichidan oching!</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: initData })
                });

                const result = await response.json();

                if (!result.ok) {
                    listEl.innerHTML = `<div class="empty">${result.error || 'Xatolik yuz berdi'}</div>`;
                    return;
                }

                if (result.messages.length === 0) {
                    listEl.innerHTML = '<div class="empty">Hali xabarlar tarixi bo\'sh 📭</div>';
                    return;
                }

                listEl.innerHTML = '';
                result.messages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'msg-card';
                    card.innerHTML = `
                        <div class="msg-header">
                            <span>📌 Xabar ID: #${msg.id}</span>
                        </div>
                        <div class="msg-body">
                            ${msg.text ? escapeHtml(msg.text) : '<i>Media xabar</i>'}
                        </div>
                    `;
                    listEl.appendChild(card);
                });

            } catch (err) {
                listEl.innerHTML = '<div class="empty">Serverga ulanishda xatolik yuz berdi! Termux da cloudflared ishlab turganini tekshiring.</div>';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchMessages();
    </script>
</body>
</html>
