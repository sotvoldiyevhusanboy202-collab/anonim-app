<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Barcha Xabarlar Tarixi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1f2937);
            --text-color: var(--tg-theme-text-color, #f9fafb);
            --card-bg: var(--tg-theme-secondary-bg-color, #273444);
            --hint-color: var(--tg-theme-hint-color, #9ca3af);
            --border-color: rgba(255, 255, 255, .10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
        }
        h2 { margin: 0 0 8px; font-size: 21px; }
        .subtitle { margin: 0 0 16px; color: var(--hint-color); font-size: 13px; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
        button {
            border: 0; border-radius: 9px; padding: 10px 13px;
            background: var(--card-bg); color: var(--text-color);
            font-size: 14px; cursor: pointer;
        }
        .msg-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 14px; margin-bottom: 12px;
        }
        .msg-header {
            display: flex; flex-wrap: wrap; justify-content: space-between;
            gap: 6px; margin-bottom: 10px; color: var(--hint-color);
            font-size: 12px;
        }
        .msg-body {
            font-size: 15px; line-height: 1.5; overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .loading, .empty, .error {
            text-align: center; padding: 32px 18px; color: var(--hint-color);
            line-height: 1.5;
        }
        .error { color: #fca5a5; }
        .count { color: var(--hint-color); font-size: 12px; margin: 0 0 12px; }
    </style>
</head>
<body>
    <main>
        <h2>ðŸ“¨ Barcha Xabarlar Tarixi</h2>
        <p class="subtitle">Siz koâ€˜rishga ruxsat berilgan xabarlar</p>
        <div class="toolbar">
            <button id="refresh-btn" type="button">ðŸ”„ Yangilash</button>
        </div>
        <p id="count" class="count" hidden></p>
        <section id="messages-list" aria-live="polite">
            <div class="loading">Xabarlar yuklanmoqda...</div>
        </section>
    </main>

    <script>
        "use strict";

        // Bu manzil backend ishlayotgan Cloudflare Tunnel manzili boâ€˜lishi kerak.
        // Tunnel manzili oâ€˜zgarsa, shu qatorni yangilang.
        const API_URL = "https://cold-scanned-dirt-orders.trycloudflare.com";
        const tg = window.Telegram && window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

        const listEl = document.getElementById("messages-list");
        const countEl = document.getElementById("count");
        const refreshBtn = document.getElementById("refresh-btn");

        if (tg) {
            tg.ready();
            tg.expand();
        }

        function showMessage(text, className = "empty") {
            listEl.replaceChildren();
            const div = document.createElement("div");
            div.className = className;
            div.textContent = text;
            listEl.appendChild(div);
            countEl.hidden = true;
        }

        function addText(parent, tag, className, text) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            el.textContent = text == null || text === "" ? "" : String(text);
            parent.appendChild(el);
            return el;
        }

        async function fetchMessages() {
            refreshBtn.disabled = true;
            showMessage("Xabarlar yuklanmoqda...");

            if (!tg) {
                showMessage("Telegram Web App muhiti aniqlanmadi. Sahifani bot ichidagi Mini App tugmasi orqali oching.", "error");
                refreshBtn.disabled = false;
                return;
            }

            const initData = tg.initData || "";
            if (!initData) {
                showMessage("Telegram foydalanuvchi maâ€™lumotlari olinmadi. Sahifani oddiy brauzerdan emas, Telegram ilovasi ichidan oching.", "error");
                refreshBtn.disabled = false;
                return;
            }

            try {
                const response = await fetch(`${API_URL.replace(/\/+$/, "")}/api/messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initData })
                });

                let result;
                try {
                    result = await response.json();
                } catch {
                    throw new Error(`Server JSON javob qaytarmadi (HTTP ${response.status}). Tunnel va backend holatini tekshiring.`);
                }

                if (!response.ok || !result.ok) {
                    const errorText = result && result.error ? result.error : `Server xatosi (HTTP ${response.status}).`;
                    showMessage(errorText, "error");
                    return;
                }

                const messages = Array.isArray(result.messages) ? result.messages : [];
                if (messages.length === 0) {
                    showMessage("Hali xabarlar tarixi boâ€˜sh ðŸ“­");
                    return;
                }

                listEl.replaceChildren();
                messages.forEach((msg, index) => {
                    const card = document.createElement("article");
                    card.className = "msg-card";

                    const header = document.createElement("div");
                    header.className = "msg-header";
                    const label = document.createElement("span");
                    label.textContent = `ðŸ“Œ Xabar ${index + 1}${msg.id != null ? " Â· ID: " + msg.id : ""}`;
                    header.appendChild(label);

                    if (msg.created) {
                        const date = document.createElement("time");
                        date.textContent = String(msg.created);
                        header.appendChild(date);
                    }
                    card.appendChild(header);

                    const body = document.createElement("div");
                    body.className = "msg-body";

                    // Admin API javobida kimdan/kimga/xabar bitta text ichida kelishi mumkin.
                    // Oddiy foydalanuvchi API javobida ham text maydoni ishlatiladi.
                    const text = msg.text == null ? "" : String(msg.text);
                    body.textContent = text || (msg.msg_type && msg.msg_type !== "text"
                        ? `Matnsiz media xabar (${msg.msg_type})`
                        : "Bu xabarning matni saqlanmagan.");

                    card.appendChild(body);
                    listEl.appendChild(card);
                });

                countEl.textContent = `Jami koâ€˜rsatilgan xabarlar: ${messages.length} ta`;
                countEl.hidden = false;
            } catch (err) {
                console.error("Xabarlar tarixini olishda xatolik:", err);
                showMessage(
                    err && err.message
                        ? `Serverga ulanib boâ€˜lmadi: ${err.message}`
                        : "Serverga ulanishda xatolik yuz berdi. API manzili va backendni tekshiring.",
                    "error"
                );
            } finally {
                refreshBtn.disabled = false;
            }
        }

        refreshBtn.addEventListener("click", fetchMessages);
        fetchMessages();
    </script>
</body>
</html>
